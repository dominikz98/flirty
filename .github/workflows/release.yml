name: Release

# Publishing of the three NuGet packages (#49, third added in #126). DELIBERATELY manual: a push to NuGet.org is
# irreversible (versions can only be unlisted, not deleted). Hence no tag/push trigger, but
# workflow_dispatch + an approval gate via the "nuget" environment. Details: docs/NUGET-PACKAGING.md.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Package revision. Version = YYYYMM.<revision>.0 (NuGet appends the 3rd segment). Empty = run number of this workflow.'
        required: false
        type: string
      dry_run:
        description: 'Only build, test, pack and verify – do not publish.'
        required: false
        default: false
        type: boolean

# The push needs no GitHub permissions at all, only the secret from the environment.
permissions:
  contents: read

concurrency:
  # Deliberately WITHOUT cancel-in-progress: do not cut off a running push mid-upload.
  group: release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # MSBuild reads env variables as properties -> overrides the default revision (1) from
  # Directory.Build.targets consistently for build AND pack. Without an input, the run number of this
  # workflow is used (its own, monotonically increasing release counter; CI never pushes anyway).
  BuildRevision: ${{ inputs.revision || github.run_number }}

jobs:
  build:
    name: build · test · pack · verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Flirty.sln

      - name: Build (Release)
        run: dotnet build Flirty.sln -c Release --no-restore

      # Only the unit/integration suite, deliberately without coverage and without the Playwright E2E:
      # This run builds the binaries ANEW (different version stamp), so exactly these must be tested –
      # the unit suite covers both packages to 95.7 % (lines). In #48 the E2E was measured to add exactly
      # one branch (368 -> 369 of 430), but it costs a browser install and is the run most likely to tip
      # into timeouts on the runner's two cores. See docs/CI.md.
      - name: Test (unit/integration)
        run: dotnet test tests/Flirty.Tests -c Release --no-build

      - name: Pack (all NuGet packages)
        run: dotnet pack Flirty.sln -c Release --no-build -o artifacts

      # Hard guard before the push: checks the issue's acceptance criterion ("all packages incl.
      # symbols") against the real files – plus the four DLLs from IncludeFlirtyMigrationAssemblies
      # (src/Flirty/Flirty.csproj), without which package consumers cannot auto-migrate.
      # A new packable project needs its pair added here, or it would ship unpacked and unnoticed.
      - name: Verify packages
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          # Careful: "Flirty.*.nupkg" also matches Flirty.AspNetCore.*.nupkg. The version always
          # starts with a digit, so "Flirty.[0-9]*" cleanly separates out the core package.
          for expected in \
            "artifacts/Flirty.[0-9]*.nupkg" \
            "artifacts/Flirty.[0-9]*.snupkg" \
            "artifacts/Flirty.AspNetCore.[0-9]*.nupkg" \
            "artifacts/Flirty.AspNetCore.[0-9]*.snupkg" \
            "artifacts/Flirty.Mcp.[0-9]*.nupkg" \
            "artifacts/Flirty.Mcp.[0-9]*.snupkg"
          do
            compgen -G "$expected" > /dev/null || fail "Expected file missing: $expected"
          done

          core=$(compgen -G "artifacts/Flirty.[0-9]*.nupkg" | head -n1)

          for dll in Flirty.dll \
                     Flirty.Migrations.Sqlite.dll \
                     Flirty.Migrations.PostgreSql.dll \
                     Flirty.Migrations.SqlServer.dll
          do
            unzip -l "$core" | grep -q "lib/net10.0/$dll" \
              || fail "$dll missing under lib/net10.0/ in $core"
          done

          {
            echo "### Packages (revision \`$BuildRevision\`)"
            echo
            echo '```'
            ls -1 artifacts/*.nupkg artifacts/*.snupkg
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  push:
    name: push · nuget.org
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Carries the NUGET_API_KEY secret and (optionally) the "Required reviewers" – the actual
    # approval gate. It sits deliberately BETWEEN build and push, so the artifact can be inspected
    # before approval.
    environment: nuget
    steps:
      # Deliberately NOT global.json here: this job does not check out the repo (it only downloads the
      # artifact). Nothing is built anymore – the CLI merely pushes the finished files.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # The glob stays QUOTED: dotnet resolves it itself. The matching .snupkg are pushed along
      # automatically (they sit next to the .nupkg and NuGet.org has a symbol server)
      # -> no second push needed. --skip-duplicate makes a re-run a no-op.
      - name: Push (nupkg + snupkg)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${NUGET_API_KEY:-}" ] \
            || { echo "::error::Secret NUGET_API_KEY missing in the 'nuget' environment."; exit 1; }
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Summary
        run: |
          {
            echo "### Published to nuget.org"
            echo
            for f in artifacts/*.nupkg; do
              echo "- \`$(basename "$f" .nupkg)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
