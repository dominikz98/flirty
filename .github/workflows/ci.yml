name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # MSBuild reads env variables as properties -> overrides the default revision (1)
  # from Directory.Build.targets consistently for build AND pack (assembly + package version match).
  BuildRevision: ${{ github.run_number }}

jobs:
  build:
    name: build · test · pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Flirty.sln

      # Local tools from .config/dotnet-tools.json – here: reportgenerator for the coverage report (#48).
      - name: Restore tools
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build Flirty.sln -c Release --no-restore

      # Playwright browser (Chromium) for the web-sample E2E (#45/#47). The script is generated during
      # the build; without this step the E2E tests skip themselves (SkippableFact) instead of failing.
      - name: Install Playwright browser
        run: pwsh tests/Flirty.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Deliberately two runs instead of "dotnet test Flirty.sln": the solution variant starts both
      # test assemblies IN PARALLEL. The Playwright E2E (real Kestrel + browser) then competes with the
      # unit suite (incl. Testcontainers) on the runner's two cores and runs into Action timeouts.
      #
      # Coverage (#48) comes solely from THIS run; filters are centralized in coverage.runsettings.
      # The E2E step below deliberately does not instrument – rationale in docs/CI.md § Coverage.
      - name: Test (unit/integration)
        run: >
          dotnet test tests/Flirty.Tests -c Release --no-build
          --collect:"XPlat Code Coverage" --settings coverage.runsettings
          --results-directory artifacts/coverage/unit

      - name: Test (E2E, Playwright)
        run: dotnet test tests/Flirty.E2E -c Release --no-build

      # -sourcedirs, because the packable projects build deterministically in CI
      # (ContinuousIntegrationBuild + SourceLink); without it the source paths would not resolve
      # and the HTML report would show no code.
      - name: Generate coverage report
        run: >
          dotnet reportgenerator
          -reports:artifacts/coverage/unit/**/coverage.cobertura.xml
          -targetdir:artifacts/coverage/report
          -reporttypes:"Html;Cobertura;MarkdownSummaryGithub;TextSummary"
          -sourcedirs:${{ github.workspace }}
          -title:"Flirty"

      # Surfaces the percentage right in the Actions run – without write access (permissions stays read).
      - name: Write coverage into the job summary
        run: cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/report/
          if-no-files-found: error

      - name: Pack (both NuGet packages)
        run: dotnet pack Flirty.sln -c Release --no-build -o artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
